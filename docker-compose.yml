version: '3.8'

services:
  wiki:
    build: .
    container_name: bambu_wiki_ptbr
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY:-AIzaSyBLLcxsuqLl1KnyKvszoQbTkegAxDRDiw0}
      - HOST=0.0.0.0
      - PORT=8000
    volumes:
      # Persistência do banco de dados e imagens baixadas
      - ./wiki_bambu.db:/app/wiki_bambu.db
      - ./app/static/images/wiki:/app/app/static/images/wiki
      - ./cache/pages:/app/cache/pages
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/stats"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
